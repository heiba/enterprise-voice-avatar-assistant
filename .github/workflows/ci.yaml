name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint chart --set global.domain=apps.example.com
      - run: helm lint chart -f chart/values-demo-cluster.yaml
      - run: helm template assistant chart --namespace voice-avatar-assistant --set global.domain=apps.example.com > /dev/null

  python:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, rag-api, voice-agent]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
