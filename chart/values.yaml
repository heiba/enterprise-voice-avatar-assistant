# Default values for the enterprise voice and avatar assistant quickstart.
#
# Install as a regular user:
#   helm install assistant chart -n <project> --set global.domain=<apps domain>
#
# Secrets are NOT generated by this chart (Argo CD would regenerate them on every
# sync). Create them once with scripts/create-secrets.sh, or point the names under
# `secrets` at secrets you manage yourself. Expected keys are listed there.

global:
  # Wildcard apps domain of the cluster, e.g. apps.ocp.example.com.
  # When set, Routes get deterministic hosts (<name>-<namespace>.<domain>) and
  # n8n and LiveKit learn their public URLs. When empty, OpenShift assigns hosts
  # and you must set n8n.publicHost and livekit.publicHost yourself.
  domain: ""
  # Leave empty to use the cluster default StorageClass.
  storageClassName: ""
  imagePullPolicy: IfNotPresent

# Application images built from this repository (frontend, rag-api, ingestion,
# voice-agent). Each component can override its full image reference.
images:
  registry: quay.io/rh-ai-quickstart
  tag: latest

# Names of the pre-created Secrets. Keys per secret:
#   postgres:     POSTGRESQL_USER, POSTGRESQL_PASSWORD, POSTGRESQL_DATABASE, DATABASE_URL
#   minio:        MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
#   n8n:          N8N_ENCRYPTION_KEY
#   livekit:      LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#   models:       LLM_API_KEY, STT_API_KEY, TTS_API_KEY, EMBEDDINGS_API_KEY, GUARDRAILS_API_KEY, HF_TOKEN
#   integrations: SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, SIMLI_API_KEY, SIMLI_FACE_ID,
#                 ELEVENLABS_API_KEY, GOOGLE_SERVICE_ACCOUNT_JSON
secrets:
  postgres: assistant-postgres
  minio: assistant-minio
  n8n: assistant-n8n
  livekit: assistant-livekit
  models: assistant-models
  integrations: assistant-integrations

# ---------------------------------------------------------------------------
# Datastores and infrastructure. All run under the restricted SCC (no fixed UID).
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image: quay.io/sclorg/postgresql-16-c9s:20260902
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

qdrant:
  enabled: true
  image: docker.io/qdrant/qdrant:v1.19.1
  collection: documents
  storage: 10Gi
  # Name of a Secret with key QDRANT_API_KEY. When set, Qdrant requires the key
  # and the application services receive it. scripts/create-secrets.sh creates
  # assistant-qdrant for this purpose.
  apiKeySecret: ""
  # Expose the Qdrant HTTP API and dashboard (/dashboard) through a Route.
  # Only enable together with apiKeySecret.
  route: false
  publicHost: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

minio:
  enabled: true
  image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
  mcImage: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
  # Buckets created after install. `eventBuckets` also notify n8n on new objects.
  buckets:
    - documents
    - inbox
    - transcripts
  eventBuckets:
    - documents
    - inbox
  storage: 20Gi
  console:
    route: true
    publicHost: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

n8n:
  enabled: true
  image: ghcr.io/n8n-io/n8n:2.37.11
  # Maximum webhook payload in MiB.
  payloadSizeMaxMb: 16
  # Public hostname. Computed from global.domain when empty.
  publicHost: ""
  storage: 5Gi
  timezone: Europe/Amsterdam
  # Extra environment variables passed to n8n (string values).
  extraEnv: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

livekit:
  enabled: true
  image: docker.io/livekit/livekit-server:v1.13.6
  # Public hostname for the WebSocket signaling Route. Computed from global.domain when empty.
  publicHost: ""
  # WebRTC media cannot pass through an HTTP Route. On OpenShift the practical
  # option is LiveKit's built-in TURN server over TLS (port 5349) behind a
  # passthrough Route on 443. It needs a certificate the browser trusts for
  # turn.publicHost, stored in a kubernetes.io/tls Secret (for example a copy of
  # the cluster's wildcard ingress certificate, or one issued by cert-manager).
  turn:
    enabled: false
    publicHost: ""
    tlsSecret: ""
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ---------------------------------------------------------------------------
# Models. Each model has a `deploy` toggle: true creates a vLLM ServingRuntime
# and InferenceService on OpenShift AI in this namespace; false uses `endpoint`,
# an existing OpenAI-compatible base URL (include /v1). `servedModelName` is
# the model name clients send in requests.
# ---------------------------------------------------------------------------
models:
  runtimeImage: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4

  llm:
    deploy: true
    name: llama-3-1-8b-instruct
    displayName: Llama 3.1 8B Instruct (W4A16)
    servedModelName: llama-3.1-8b-instruct
    # Red Hat AI validated modelcar, about 6 GiB of weights. Pulled with the
    # cluster's registry.redhat.io pull secret (present on every OpenShift install).
    # Alternative without that registry: hf://RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8
    storageUri: oci://registry.redhat.io/rhelai1/modelcar-llama-3-1-8b-instruct-quantized-w4a16:1.5
    # Without a limit vLLM reserves KV cache for the full 128k window, which does
    # not fit next to the weights on a 24 GiB GPU and the engine fails to start.
    args:
      - --max-model-len=16384
      - --gpu-memory-utilization=0.90
      - --enable-auto-tool-choice
      - --tool-call-parser=llama3_json
    resources:
      requests:
        cpu: "2"
        memory: 12Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 24Gi
        nvidia.com/gpu: "1"
    endpoint: ""

  stt:
    deploy: true
    name: whisper-large-v3-turbo
    displayName: Whisper large-v3-turbo (W4A16)
    servedModelName: whisper-large-v3-turbo
    storageUri: oci://registry.redhat.io/rhelai1/modelcar-whisper-large-v3-turbo-quantized-w4a16:1.5
    args: []
    resources:
      requests:
        cpu: "1"
        memory: 8Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "2"
        memory: 12Gi
        nvidia.com/gpu: "1"
    endpoint: ""

  embeddings:
    deploy: true
    name: bge-m3
    displayName: BGE-M3 embeddings
    servedModelName: bge-m3
    storageUri: hf://BAAI/bge-m3
    args:
      - --task=embed
      - --max-model-len=8192
    resources:
      requests:
        cpu: "1"
        memory: 6Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "2"
        memory: 12Gi
        nvidia.com/gpu: "1"
    endpoint: ""

  guardrails:
    # Provider used by the RAG API: none | granite-guardian | llama-guard | trustyai
    provider: none
    deploy: false
    name: granite-guardian-3-3-8b
    displayName: Granite Guardian 3.3 8B
    servedModelName: granite-guardian-3.3-8b
    storageUri: oci://quay.io/redhat-ai-services/modelcar-catalog:granite-guardian-3.3-8b
    # The modelcar ships no chat template and vLLM refuses to guess one, so the
    # official template from the model's Hugging Face repo is mounted from chart/files.
    chatTemplateFile: files/granite-guardian-3.3-chat-template.jinja
    args:
      - --max-model-len=8192
      - --gpu-memory-utilization=0.90
    resources:
      requests:
        cpu: "2"
        memory: 12Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 24Gi
        nvidia.com/gpu: "1"
    endpoint: ""

  tts:
    # Kokoro exposes the OpenAI speech API on CPU. Set deploy=false and endpoint
    # to use another OpenAI-compatible TTS service (or ElevenLabs via the voice agent).
    deploy: true
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.2
    servedModelName: kokoro
    voice: af_heart
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 4Gi
    endpoint: ""

# ---------------------------------------------------------------------------
# Application services built from this repository.
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  image: ""
  replicas: 1
  route: true
  publicHost: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ragApi:
  enabled: true
  image: ""
  replicas: 1
  topK: 5
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

ingestion:
  enabled: true
  image: ""
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi

voiceAgent:
  enabled: true
  image: ""
  replicas: 1
  # none | simli | heygen | tavus
  avatarProvider: none
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
