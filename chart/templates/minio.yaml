{{- if .Values.minio.enabled }}
{{- $consoleHost := include "assistant.publicHost" (dict "root" . "name" "minio-console" "override" .Values.minio.console.publicHost) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "minio") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.global.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "minio") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "minio") | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.minio }}
          env:
            {{- if $consoleHost }}
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://{{ $consoleHost }}
            {{- end }}
            {{- if .Values.n8n.enabled }}
            # Bucket notifications go to the n8n ingestion webhook (workflow WF2).
            - name: MINIO_NOTIFY_WEBHOOK_ENABLE_N8N
              value: "on"
            - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_N8N
              value: http://n8n:5678/webhook/minio-event
            {{- end }}
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "minio") | nindent 4 }}
spec:
  selector:
    {{- include "assistant.selector" (dict "root" . "name" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
{{- if .Values.minio.console.route }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-console
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "minio") | nindent 4 }}
spec:
  {{- if $consoleHost }}
  host: {{ $consoleHost }}
  {{- end }}
  to:
    kind: Service
    name: minio
  port:
    targetPort: console
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
---
# Creates buckets and wires bucket notifications after every install or sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "minio-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "minio-setup") | nindent 8 }}
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.minio }}
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for minio"; sleep 5
              done
              {{- range .Values.minio.buckets }}
              mc mb --ignore-existing local/{{ . }}
              {{- end }}
              {{- if .Values.n8n.enabled }}
              {{- range .Values.minio.eventBuckets }}
              mc event add local/{{ . }} arn:minio:sqs::N8N:webhook --event put --ignore-existing || echo "event target for {{ . }} not added (n8n webhook may not be configured yet)"
              {{- end }}
              {{- end }}
              echo "minio setup complete"
{{- end }}
