# Included inside the default server block of the UBI nginx image (listens on 8080).
# __RAG_API_UPSTREAM__ is replaced at container start from RAG_API_UPSTREAM.
client_max_body_size 25m;

location /api/ {
    proxy_pass http://__RAG_API_UPSTREAM__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# Single-page app: unknown paths serve index.html, which is never cached so new builds show up on reload
error_page 404 =200 /index.html;
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}
