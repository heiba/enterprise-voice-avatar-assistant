# Overrides for the team demo cluster (Red Hat demo platform, 1 node, 4x NVIDIA L4).
# Used by deploy/argocd/application.yaml together with values.yaml.
global:
  domain: apps.ocp.6s896.sandbox2112.opentlc.com

# Application images are built by .github/workflows/build-images.yaml and pushed
# to GitHub's container registry. The workflow rewrites the per-service image
# tags below after every successful build.
images:
  registry: ghcr.io/rh-ai-quickstart

voiceAgent:
  enabled: true
  # Tavus renders the avatar from the agent audio; keys TAVUS_API_KEY and TAVUS_FACE_ID
  # live in the assistant-integrations secret (oc set data), never in this file.
  avatarProvider: tavus
  extraEnv:
    # Tavus stock face "Jackie - Office"; overrides the value in the assistant-integrations secret.
    TAVUS_FACE_ID: r67d1c9cac37
  image: ghcr.io/rh-ai-quickstart/assistant-voice-agent:sha-051738e
frontend:
  enabled: true
  image: ghcr.io/rh-ai-quickstart/assistant-frontend:sha-051738e
ragApi:
  enabled: true
  image: ghcr.io/rh-ai-quickstart/assistant-rag-api:sha-051738e
ingestion:
  enabled: true
  image: ghcr.io/rh-ai-quickstart/assistant-ingestion:sha-051738e

models:
  tts:
    # Bright female Kokoro voice to match the Tavus stock face (af_bella, grade A-; af_heart is warmer).
    voice: af_bella
  # The LLM, embeddings, and guardrails come from this chart. Whisper reuses the
  # model already served by OpenShift AI in the `whisper` namespace.
  stt:
    deploy: false
    # LLMInferenceService workloads serve TLS with a certificate from the
    # OpenShift service CA, which every pod trusts through SERVICE_CA_FILE.
    endpoint: https://redhataiwhisper-large-v3-turbo-kserve-workload-svc.whisper.svc.cluster.local:8000/v1
    servedModelName: redhataiwhisper-large-v3-turbo
  guardrails:
    provider: granite-guardian
    deploy: true

# Qdrant dashboard for the demo (protected by the API key from assistant-qdrant).
qdrant:
  apiKeySecret: assistant-qdrant
  route: true

livekit:
  turn:
    # TURN over TLS behind a passthrough Route. Needs the cluster's wildcard
    # ingress certificate copied into the namespace as a kubernetes.io/tls
    # secret named livekit-turn-tls (the pod waits for it).
    enabled: true
    tlsSecret: livekit-turn-tls

n8n:
  extraEnv:
    # Google Drive folder that receives archived transcripts (WF5). Not a secret:
    # the folder is only readable by the Google account connected in n8n.
    GOOGLE_DOCS_FOLDER_ID: 1BT_vPj58sulZQIY7--05lrhP8WX9UbmX
