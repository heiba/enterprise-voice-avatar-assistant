apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: redhat-ods-operator
  namespace: redhat-ods-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
spec:
  # "stable-3.5" pins the release this quickstart was built on; "stable" follows the
  # current supported release. scripts/bootstrap-cluster.sh applies this file only when
  # OpenShift AI is absent, so an existing installation keeps its own channel.
  channel: stable-3.5
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
