# Builds the application images on every push to main and publishes them to
# quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-<service> (tags sha-<7> and latest). After a
# successful build the new tag is written into chart/values-demo-cluster.yaml,
# which Argo CD picks up and rolls out. The chart directory is excluded from the
# trigger paths so that promotion commit does not start another build.
name: Build images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - ".github/workflows/build-images.yaml"
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: quay.io/rh-ai-quickstart
  IMAGE_PREFIX: enterprise-voice-avatar-assistant

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion
            context: services/ingestion
            values_key: ingestion
          - service: rag-api
            context: services/rag-api
            values_key: ragApi
          - service: frontend
            context: frontend
            values_key: frontend
          - service: voice-agent
            context: services/voice-agent
            values_key: voiceAgent
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_PREFIX}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote:
    name: promote tags to the demo cluster values
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: update image references
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          python3 - "$tag" "$REGISTRY" "$IMAGE_PREFIX" <<'PY'
          import re, sys, pathlib
          tag, registry, prefix = sys.argv[1], sys.argv[2], sys.argv[3]
          services = {"ingestion": "ingestion", "ragApi": "rag-api", "frontend": "frontend", "voiceAgent": "voice-agent"}   # values key -> image name suffix
          p = pathlib.Path("chart/values-demo-cluster.yaml"); text = p.read_text()
          for key, name in services.items():
              image = f"{registry}/{prefix}-{name}:{tag}"
              pattern = re.compile(rf"(^{key}:\n(?:[ \t]+.*\n)*?[ \t]+image:[ \t]*).*$", re.M)
              if pattern.search(text):
                  text = pattern.sub(rf"\g<1>{image}", text)
              else:
                  text += f"\n{key}:\n  image: {image}\n"
          p.write_text(text)
          PY
          git diff --stat
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "nothing to promote"; exit 0; fi
          git commit -am "ci: deploy images sha-${GITHUB_SHA::7} to the demo cluster"
          git push origin HEAD:main
