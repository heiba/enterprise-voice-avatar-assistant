# Overrides for the team demo cluster (Red Hat demo platform, 1 node, 4x NVIDIA L4).
# Used by deploy/argocd/application.yaml together with values.yaml.
global:
  domain: apps.ocp.6s896.sandbox2112.opentlc.com

# Application images are built by .github/workflows/build-images.yaml and pushed
# to GitHub's container registry. The workflow rewrites the per-service image
# tags below after every successful build.
images:
  registry: ghcr.io/heiba

frontend:
  enabled: false
ragApi:
  enabled: false
voiceAgent:
  enabled: false
ingestion:
  enabled: true
  image: ghcr.io/heiba/assistant-ingestion:latest

models:
  # The LLM, embeddings, and guardrails come from this chart. Whisper reuses the
  # model already served by OpenShift AI in the `whisper` namespace.
  stt:
    deploy: false
    # LLMInferenceService workloads serve TLS with a certificate from the
    # OpenShift service CA, which every pod trusts through SERVICE_CA_FILE.
    endpoint: https://redhataiwhisper-large-v3-turbo-kserve-workload-svc.whisper.svc.cluster.local:8000/v1
    servedModelName: redhataiwhisper-large-v3-turbo
  guardrails:
    provider: granite-guardian
    deploy: true

# Qdrant dashboard for the demo (protected by the API key from assistant-qdrant).
qdrant:
  apiKeySecret: assistant-qdrant
  route: true

livekit:
  turn:
    # Enable after copying the cluster wildcard certificate into the namespace
    # as a kubernetes.io/tls secret named livekit-turn-tls.
    enabled: false
    tlsSecret: livekit-turn-tls
