# Values for demo cluster 1, a Red Hat Demo Platform "Red Hat OpenShift AI 3" environment,
# single-node OpenShift 4.20 on one AWS g6 instance with a single NVIDIA L4 (24 GB).
# Cluster 2 has its own file, values-demo-cluster-2.yaml; scripts/deploy-argocd.sh picks the
# file with VALUES_FILE.
# SETUP.md walks through the whole setup. The cluster's apps domain is not stored here:
# scripts/deploy-argocd.sh passes global.domain to the Argo CD application from the cluster
# it is logged in to, so this file works unchanged on the next cluster.
#
# Application images are built by .github/workflows/build-images.yaml and pushed to
# quay.io/rh-ai-quickstart. The workflow rewrites the per-service image references below
# after every successful build (pinned by commit).
images:
  registry: quay.io/rh-ai-quickstart

voiceAgent:
  enabled: true
  # Tavus renders the avatar from the agent audio. TAVUS_API_KEY (and optionally
  # TAVUS_FACE_ID) come from the assistant-integrations secret (scripts/create-secrets.sh).
  avatarProvider: tavus
  # Faces offered in the UI (Tavus stock faces; scripts/list-tavus-faces.sh lists them).
  # The voice follows the declared gender through models.tts.voices; the first entry is the default.
  faces:
    - id: r67d1c9cac37
      name: Jackie
      gender: female
    - id: re6220ec0195
      name: Raj
      gender: male
    - id: r873e4707689
      name: James
      gender: male
    - id: rf6b1c8d5e9d
      name: Samantha
      gender: female
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-voice-agent:sha-2f926ec
frontend:
  enabled: true
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-frontend:sha-2f926ec
ragApi:
  enabled: true
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-rag-api:sha-2f926ec
ingestion:
  enabled: true
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-ingestion:sha-2f926ec

# One L4 shared by three vLLM servers through GPU time-slicing (scripts/bootstrap-cluster.sh,
# GPU_SLICES=4 advertises the card as four nvidia.com/gpu). Each server gets a fixed share of
# the 24 GB; the shares add up to 72% to leave room for the CUDA context of each process.
# Granite Guardian does not fit next to them, so the guardrail provider is off on this cluster.
models:
  llm:
    args:
      - --max-model-len=8192
      - --gpu-memory-utilization=0.45
      - --max-num-seqs=8
      - --enforce-eager
      - --enable-auto-tool-choice
      - --tool-call-parser=llama3_json
  stt:
    deploy: true
    args:
      - --gpu-memory-utilization=0.15
      - --enforce-eager
  embeddings:
    args:
      - --runner=pooling
      - --max-model-len=8192
      - --gpu-memory-utilization=0.12
      - --enforce-eager
  guardrails:
    provider: none
    deploy: false
  tts:
    # Bright female Kokoro voice for the default face (af_bella, grade A-; af_heart is warmer).
    voice: af_bella

# Qdrant dashboard for the demo (protected by the API key from assistant-qdrant).
qdrant:
  apiKeySecret: assistant-qdrant
  route: true

livekit:
  turn:
    # TURN over TLS behind a passthrough Route, needed for browsers behind corporate
    # networks. The certificate secret is created by scripts/setup-turn-tls.sh (a copy of
    # the cluster's wildcard certificate, or one issued by cert-manager).
    enabled: true
    tlsSecret: livekit-turn-tls
