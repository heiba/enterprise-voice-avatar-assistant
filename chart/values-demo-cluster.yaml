# Overrides for the team demo cluster (Red Hat demo platform, 1 node, 4x NVIDIA L4).
# Used by deploy/argocd/application.yaml together with values.yaml.
global:
  domain: apps.ocp.6s896.sandbox2112.opentlc.com

# Application images are not published yet; enable once CI pushes them.
frontend:
  enabled: false
ragApi:
  enabled: false
ingestion:
  enabled: false
voiceAgent:
  enabled: false

models:
  # Reuse the models already served by OpenShift AI on this cluster instead of
  # deploying second copies: Llama 3.1 8B Instruct (W4A16) in `my-first-model`
  # and Whisper in `whisper`. Set deploy: true again to run our own.
  llm:
    deploy: false
    endpoint: http://redhataimeta-llama-31-8b-instr-kserve-workload-svc.my-first-model.svc.cluster.local:8000/v1
    servedModelName: redhataimeta-llama-31-8b-instr
  stt:
    deploy: false
    endpoint: http://redhataiwhisper-large-v3-turbo-kserve-workload-svc.whisper.svc.cluster.local:8000/v1
    servedModelName: redhataiwhisper-large-v3-turbo
  guardrails:
    provider: granite-guardian
    deploy: true

# Qdrant dashboard for the demo (protected by the API key from assistant-qdrant).
qdrant:
  apiKeySecret: assistant-qdrant
  route: true

livekit:
  turn:
    # Enable after copying the cluster wildcard certificate into the namespace
    # as a kubernetes.io/tls secret named livekit-turn-tls.
    enabled: false
    tlsSecret: livekit-turn-tls
